# Sobe o banco (PostgreSQL) e o backend (Node/Express) juntos.
# O frontend roda localmente com `npm run dev` e aponta para http://localhost:3000.
#
#   docker compose up -d      # sobe tudo em segundo plano
#   docker compose logs -f    # acompanha os logs
#   docker compose down       # para os contêineres (mantém os dados)
#   docker compose down -v    # para e APAGA o banco (reaplica schema/seed na próxima subida)

services:
  db:
    image: postgres:16-alpine
    container_name: achados_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_achados
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: achados_perdidos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # scripts em db/init rodam automaticamente na PRIMEIRA subida (ordem alfabética)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_achados -d achados_perdidos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: achados_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      # dentro da rede do compose, o banco é acessível pelo nome do serviço: "db"
      DATABASE_URL: postgresql://app_achados:1234@db:5432/achados_perdidos
      JWT_SECRET: ${DOCKER_JWT_SECRET:?Configure DOCKER_JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy   # só sobe o backend quando o banco está pronto

volumes:
  pgdata:

